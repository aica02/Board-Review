[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Firebase web config is public by design and is embedded in the client bundle by Vite.
  # Exclude only these keys so secrets scanning still protects everything else.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET"
